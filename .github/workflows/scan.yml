name: Predict Gap Scan

on:
  schedule:
    - cron: "15 */4 * * *"   # every 4 hours
  workflow_dispatch:
    inputs:
      debug_titles:
        description: "Print sample titles + top similarity matches for tuning"
        type: boolean
        default: false
      min_gap:
        description: "Min gap threshold in points, e.g. 0.04 (blank = default)"
        type: string
        default: ""
      min_similarity:
        description: "Override min title similarity 0-1 (blank = default 0.32)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run scan
        env:
          DEBUG_TITLES: ${{ github.event.inputs.debug_titles }}
          MIN_GAP: ${{ github.event.inputs.min_gap }}
          MIN_SIMILARITY: ${{ github.event.inputs.min_similarity }}
        run: python src/scan.py

      - name: Commit updated site
        run: |
          git config user.name "predict-gap-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "Update gap scan $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git push || true

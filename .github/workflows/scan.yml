name: Predict Gap Scan

on:
  schedule:
    - cron: "15 */4 * * *"   # every 4 hours
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run scan
        run: python src/scan.py

      - name: Commit updated site
        run: |
          git config user.name "predict-gap-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "Update gap scan $(date -u +%Y-%m-%dT%H:%MZ)" || true
          git push || true
